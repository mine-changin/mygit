<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocSolver (단독 실행)</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface2:#f8fafc;--tx:#0f172a;--tx2:#475569;--mute:#8492a6;--line:#e2e8f0;
  --pri:#4f46e5;--pri-soft:#eef2ff;--pri-tx:#fff;
  --hi:#dc2626;--hi-bg:#fef2f2;--md:#d97706;--md-bg:#fffbeb;--lo:#16a34a;--lo-bg:#f0fdf4;
  --code:#f1f5f9;--mark:#fef08a;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);--r:14px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1020;--surface:#141a2e;--surface2:#10162a;--tx:#e8ecf6;--tx2:#aab4c8;--mute:#7482a0;--line:#25304a;
  --pri:#818cf8;--pri-soft:#1c2347;--pri-tx:#0b1020;
  --hi:#f87171;--hi-bg:#2a1418;--md:#fbbf24;--md-bg:#2a2210;--lo:#4ade80;--lo-bg:#10251a;
  --code:#0d1326;--mark:#6b5b12;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.mono,code,pre{font-family:ui-monospace,"JetBrains Mono","D2Coding",Menlo,Consolas,monospace}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.hd h1{font-size:18px;margin:0;letter-spacing:-.3px}
.hd .tag{color:var(--mute);font-size:13px;display:none}
@media(min-width:720px){.hd .tag{display:block}}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--tx2);border-radius:99px;padding:5px 12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.pill.on .dot{background:var(--lo);box-shadow:0 0 0 3px color-mix(in srgb,var(--lo) 25%,transparent)}

/* ---------- layout ---------- */
.app{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
@media(max-width:900px){
  aside{display:contents}
  .up{order:1}main{order:2}.aibox{order:3}
  #drop{padding:14px 10px}#drop .ic{display:none}.files{max-height:160px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.ttl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}

/* ---------- upload ---------- */
#drop{border:2px dashed var(--line);border-radius:12px;background:var(--surface2);padding:22px 14px;text-align:center;cursor:pointer;transition:.15s}
#drop:hover,#drop.on{border-color:var(--pri);background:var(--pri-soft)}
#drop .ic{font-size:28px;line-height:1}
#drop b{display:block;margin-top:6px}
#drop small{color:var(--mute);font-size:12.5px}
.files{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.file .fi{font-size:18px}
.file .fn{flex:1;min-width:0}
.file .fn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fn span{font-size:12px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);width:26px;height:26px;border-radius:6px;font-size:16px}
.x:hover{background:var(--hi-bg);color:var(--hi)}
.nofile{color:var(--mute);font-size:13px;text-align:center;padding:8px 0 0}
.link{background:none;border:0;color:var(--pri);padding:0;font-size:13px;font-weight:600}
.link:hover{text-decoration:underline}

/* ---------- ai settings ---------- */
.aibox label.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.switch i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--pri)}
.switch input:checked+i:after{transform:translateX(18px)}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+i{opacity:.5}
.keyrow{display:flex;gap:6px;margin-top:10px}
.keyrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--tx);font-size:13px}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}

/* ---------- buttons / search ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--tx);border-radius:10px;padding:0 16px;height:44px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.08);color:var(--pri-tx)}
.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.searchbar{position:sticky;top:64px;z-index:10;padding:12px;margin-bottom:16px}
@media(max-width:900px){.searchbar{top:60px}}
.sbrow{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1;min-width:200px;position:relative}
.field span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.field input{width:100%;height:44px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--tx);font-size:15px}
.field input:focus{outline:2px solid var(--pri);border-color:transparent;background:var(--surface)}
.field kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px;color:var(--mute);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chips small{color:var(--mute);font-size:12.5px;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--tx2);border-radius:99px;padding:2px 11px;font-size:12.5px}
.chip:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}

/* ---------- results ---------- */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.sum{grid-template-columns:repeat(2,1fr)}}
.tile{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tile b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.5px}
.tile span{font-size:12.5px;color:var(--tx2)}
.tile.hi{background:var(--hi-bg);border-color:transparent}.tile.hi b{color:var(--hi)}
.tile.md{background:var(--md-bg);border-color:transparent}.tile.md b{color:var(--md)}
.tile.lo{background:var(--lo-bg);border-color:transparent}.tile.lo b{color:var(--lo)}
h2.sec{font-size:15px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec .n{background:var(--pri-soft);color:var(--pri);border-radius:99px;padding:0 9px;font-size:12.5px}

details.fd{border-left:4px solid var(--mute);margin-bottom:12px;overflow:hidden}
details.fd.high{border-left-color:var(--hi)}details.fd.medium{border-left-color:var(--md)}details.fd.low{border-left-color:var(--lo)}
details.fd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px}
details.fd summary::-webkit-details-marker{display:none}
details.fd summary:hover{background:var(--surface2)}
.sev{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.sev.high{background:var(--hi-bg);color:var(--hi)}.sev.medium{background:var(--md-bg);color:var(--md)}.sev.low{background:var(--lo-bg);color:var(--lo)}
.fd .ft{font-weight:700;flex:1;min-width:0}
.fd .cnt{font-size:12.5px;color:var(--mute);white-space:nowrap}
.chev{transition:.15s;color:var(--mute)}details[open] .chev{transform:rotate(90deg)}
.fb{padding:0 16px 16px}
.cause{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--tx2);margin-bottom:12px}
.cause b{color:var(--tx)}
.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 4px;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
code.cp{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;cursor:copy;word-break:break-word}
code.cp:hover{border-color:var(--pri);color:var(--pri)}
.ev{margin-top:14px}
.ev h4{margin:0 0 6px;font-size:12px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.evi{display:flex;gap:8px;font-size:12.5px;background:var(--code);border-radius:8px;padding:6px 10px;margin-bottom:4px;align-items:baseline}
.evi .loc{color:var(--pri);font-weight:600;white-space:nowrap}
.evi .tx{word-break:break-all;color:var(--tx2)}

.ai-card{border:1px solid color-mix(in srgb,var(--pri) 40%,var(--line));background:linear-gradient(180deg,var(--pri-soft),var(--surface) 70px)}
.ans{padding:4px 18px 16px;font-size:14.5px}
.ans h4{margin:14px 0 4px;font-size:15px}.ans ul,.ans ol{margin:4px 0;padding-left:22px}.ans li{margin:2px 0}
.ans pre,.hit pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12.5px;margin:8px 0;line-height:1.55}
.ans code{background:var(--code);border-radius:5px;padding:0 5px;font-size:13px}
.ans .ph{padding:14px 18px 0;font-weight:700;display:flex;align-items:center;gap:8px}
.copy{position:absolute;right:8px;top:8px;border:1px solid var(--line);background:var(--surface);color:var(--tx2);border-radius:6px;font-size:11.5px;padding:1px 8px}
.copy:hover{color:var(--pri);border-color:var(--pri)}

.hit{margin-bottom:12px;overflow:hidden}
.hh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:13.5px}
.hh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hh .ln{color:var(--mute);font-size:12.5px}
.bar{width:60px;height:6px;background:var(--line);border-radius:9px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--pri)}
.hit pre{margin:0;border:0;border-radius:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- states ---------- */
.empty{padding:36px 20px;text-align:center}
.empty .big{font-size:40px}
.empty h3{margin:8px 0 4px;font-size:18px}
.empty p{margin:0 0 18px;color:var(--tx2)}
.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin-top:18px}
@media(max-width:700px){.guide{grid-template-columns:1fr}}
.gs{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--tx2)}
.gs b{display:block;color:var(--tx);margin-bottom:2px}
.gs i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:var(--pri-tx);font-size:12px;font-weight:700;margin-bottom:6px}
.ok{padding:22px;text-align:center;color:var(--lo)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:r .8s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
.sk{height:64px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,var(--line),var(--surface2),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 모드 / 노트 ---------- */
.modes{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px;gap:2px}
.mode{border:0;background:none;color:var(--tx2);padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px}
.mode.on{background:var(--surface);color:var(--pri);box-shadow:var(--shadow)}
.filters{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fl{font-size:12px;color:var(--mute);font-weight:700}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-tx)}
.chip small{opacity:.7}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media(max-width:700px){.ov{grid-template-columns:1fr}}
.dom{display:grid;grid-template-columns:1fr 80px 38px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar2{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--pri)}
.dom b{text-align:right}
details.nt{margin-bottom:12px;overflow:hidden}
details.nt summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
details.nt summary::-webkit-details-marker{display:none}
details.nt summary:hover{background:var(--surface2)}
.nt .ft{font-weight:700;flex:1;min-width:140px}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--mute);padding:0 2px}.star.on{color:#f59e0b}
.xm{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pri-soft);color:var(--pri)}.xm.CKAD{background:var(--lo-bg);color:var(--lo)}
.cat{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.nbody{border-top:1px solid var(--line);padding-top:8px}
.ans table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow:auto}
.ans th,.ans td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ans th{background:var(--surface2)}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo">🔎</div>
  <h1>DocSolver</h1><span class="tag">파일을 올리면 문제를 찾아 해결책을 알려드립니다</span>
  <div class="sp"></div>
  <span class="pill" id="aipill"><i class="dot"></i><span>AI 꺼짐</span></span>
</div></header>

<div class="app">
<aside>
  <section class="card pad up">
    <h3 class="ttl">파일 <span id="fcount"></span></h3>
    <div id="drop" tabindex="0" role="button" aria-label="파일 추가">
      <div class="ic">📂</div><b>파일을 끌어놓거나 클릭</b>
      <small>log · txt · md · conf · yaml · json · csv · docx</small>
    </div>
    <input id="pick" type="file" multiple hidden>
    <ul class="files" id="files"></ul>
  </section>

  <section class="card pad aibox">
    <h3 class="ttl">AI 분석</h3>
    <label class="sw"><span>🤖 결과에 AI 분석 포함</span>
      <span class="switch"><input type="checkbox" id="useai"><i></i></span></label>
    <div class="keyrow" id="aikey">
      <input type="password" id="key" placeholder="Anthropic API 키" autocomplete="off">
      <button class="btn sm pri" id="savekey">적용</button>
    </div>
    <p class="hint" id="aihint">키는 이 페이지 메모리에만 보관되며 저장되지 않습니다(새로고침하면 다시 입력). 분석 시 로그 일부가 Anthropic API로 전송됩니다.</p>
  </section>
</aside>

<main>
  <section class="card searchbar">
    <div class="modes" role="tablist">
      <button class="mode on" data-m="fix" role="tab">🛠 문제 해결</button>
      <button class="mode" data-m="notes" role="tab">📚 CKA/CKAD 노트</button>
    </div>
    <div class="sbrow">
      <div class="field"><span>🔍</span>
        <input id="q" type="text" placeholder="증상·에러 메시지 검색" autocomplete="off"><kbd>/</kbd></div>
      <button class="btn pri" id="go">검색</button>
      <button class="btn" id="scan">⚡ 전체 점검</button>
    </div>
    <div class="chips" id="chips"><small>예시</small>
      <button class="chip" data-q="No space left on device">디스크 부족</button>
      <button class="chip" data-q="CrashLoopBackOff">CrashLoopBackOff</button>
      <button class="chip" data-q="permission denied selinux">권한/SELinux</button>
      <button class="chip" data-q="connection refused">연결 거부</button>
      <button class="chip" data-q="메모리 부족">메모리 부족</button>
    </div>
    <div class="filters" id="nfilters" hidden></div>
  </section>
  <div id="out"></div>
</main>
</div>
<div id="toast" role="status"></div>

"\\b(502|503|504)\\b.*(bad gateway|service unavailable|gateway time-?out)|upstream (timed out|prematurely closed)|no live upstreams", "title": "게이트웨이/업스트림 오류 (5xx)", "severity": "high", "cause": "백엔드 다운/지연, 타임아웃 설정 과소, 헬스체크 실패.", "solutions": ["백엔드 서비스 상태 및 응답시간 확인 (`curl -w '%{time_total}'`)", "프록시 타임아웃(`proxy_read_timeout` 등)·keepalive 설정 검토", "로드밸런서 헬스체크 경로/임계값, 백엔드 풀 크기 점검"]}], "notes": [{"id": "exam-overview", "title": "시험 개요와 시간 전략", "exams": ["CKA", "CKAD"], "cat": "시험 팁", "tags": ["시험", "합격", "점수", "시간", "전략", "문서", "북마크", "exam", "strategy"], "body": "# 형식\n- 온라인 감독(PSI) **실습형** 시험, 제한시간 **2시간**, 합격선 **66%**\n- 허용 자료: kubernetes.io/docs, helm 문서 등 **공식 문서 일부** (북마크 가능). 그 외 검색 불가\n# 전략\n1. 문제마다 가중치(%)가 다르다 → **쉬운 문제·가중치 높은 문제부터**, 막히면 flag 후 넘어가기\n2. **매 문제 시작 시 컨텍스트 전환 명령을 복사해 실행** (클러스터가 문제마다 다름)\n3. 작업 후 반드시 `kubectl get`/`describe` 로 결과 검증\n4. YAML 은 직접 타이핑하지 말고 `--dry-run=client -o yaml` 로 생성 후 수정\n5. 남은 시간 15분은 flag 한 문제 재시도에 사용\n# 준비\n- killer.sh 모의고사(등록 시 2회 제공)를 시험 1주 전에 풀어보기\n- 매 학습 때 `kubectl explain`, 공식 문서 검색 속도를 훈련"}, {"id": "exam-env", "title": "시험 환경 세팅 (alias · vim · 자동완성)", "exams": ["CKA", "CKAD"], "cat": "시험 팁", "tags": ["alias", "vim", "bashrc", "completion", "자동완성", "단축", "환경설정", "dry-run"], "body": "시험 시작 직후 1~2분 투자해 세팅한다. (이미 alias `k` 가 설정된 경우도 있으니 확인)\n```\nalias k=kubectl\nsource <(kubectl completion bash)\ncomplete -o default -F __start_kubectl k\nexport do=\"--dry-run=client -o yaml\"\nexport now=\"--force --grace-period 0\"\n```\n```\n# ~/.vimrc  (YAML 들여쓰기)\nset tabstop=2 shiftwidth=2 expandtab\n```\n사용 예: `k run web --image=nginx $do > pod.yaml`, `k delete pod web $now`\n- 컨텍스트/네임스페이스: `k config use-context <ctx>`, `k config set-context --current --namespace=dev`"}, {"id": "kubectl-gen", "title": "YAML 빠르게 생성 (imperative 명령)", "exams": ["CKA", "CKAD"], "cat": "시험 팁", "tags": ["run", "create", "expose", "dry-run", "yaml", "imperative", "생성", "명령형"], "body": "```\nk run nginx --image=nginx --port=80 --labels=app=web $do\nk run tmp --rm -it --image=busybox:1.36 --restart=Never -- sh\nk create deploy web --image=nginx --replicas=3 $do\nk expose deploy web --port=80 --target-port=8080 --type=NodePort\nk create job j1 --image=busybox -- echo hi\nk create cronjob c1 --image=busybox --schedule=\"*/5 * * * *\" -- date\nk create cm app-cfg --from-literal=k=v --from-file=app.conf\nk create secret generic db --from-literal=password=s3cr3t\nk create sa build-sa\nk create role r --verb=get,list --resource=pods\nk create rolebinding rb --role=r --user=jane\nk create ingress ing --rule=\"foo.com/bar*=svc1:8080\" $do\nk autoscale deploy web --min=2 --max=10 --cpu-percent=50\n```\n- DaemonSet 은 `create` 명령이 없다 → `create deploy ... $do` 로 만든 뒤 `kind: DaemonSet`, `replicas`/`strategy` 제거\n- 컨테이너 명령: `k run x --image=busybox $do -- sleep 3600` (`--` 뒤가 command/args)"}, {"id": "kubectl-output", "title": "출력 가공: jsonpath · custom-columns · sort-by", "exams": ["CKA", "CKAD"], "cat": "시험 팁", "tags": ["jsonpath", "custom-columns", "sort-by", "selector", "field-selector", "explain", "출력", "정렬"], "body": "```\nk get nodes -o jsonpath='{.items[*].metadata.name}'\nk get pods -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.status.podIP}{\"\\n\"}{end}'\nk get pods -o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[*].image\nk get pods --sort-by=.metadata.creationTimestamp\nk get pv --sort-by=.spec.capacity.storage\nk get pods -A --field-selector spec.nodeName=node01\nk get pods -l app=web,tier=front\nk get events --sort-by=.metadata.creationTimestamp\nk explain pod.spec.containers.securityContext --recursive\nk api-resources --namespaced=false\n```\n- 필드 위치를 모를 때 `k explain <resource>.<path>` 가 문서 검색보다 빠르다"}, {"id": "etcd-backup", "title": "etcd 백업 / 복구", "exams": ["CKA"], "cat": "아키텍처·설치", "tags": ["etcd", "snapshot", "backup", "restore", "백업", "복구", "etcdctl", "etcdutl"], "body": "# 백업\n```\nETCDCTL_API=3 etcdctl snapshot save /opt/etcd-backup.db \\\n  --endpoints=https://127.0.0.1:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt \\\n  --key=/etc/kubernetes/pki/etcd/server.key\netcdctl snapshot status /opt/etcd-backup.db -w table\n```\n- 인증서 경로 확인: `cat /etc/kubernetes/manifests/etcd.yaml | grep -E 'cert|key|trusted|listen-client'`\n# 복구\n```\netcdutl snapshot restore /opt/etcd-backup.db --data-dir /var/lib/etcd-restore\n# (구버전: etcdctl snapshot restore ...)\n```\n1. `/etc/kubernetes/manifests/etcd.yaml` 의 volume `etcd-data` hostPath 를 `/var/lib/etcd-restore` 로 변경\n2. kubelet 이 static pod 를 재생성할 때까지 대기 (`crictl ps | grep etcd`)\n3. `kubectl get nodes,pods -A` 로 데이터 복구 확인"}, {"id": "kubeadm-upgrade", "title": "kubeadm 클러스터 업그레이드", "exams": ["CKA"], "cat": "아키텍처·설치", "tags": ["kubeadm", "upgrade", "업그레이드", "drain", "kubelet", "apt", "버전"], "body": "마이너 버전은 **한 단계씩**만 올린다 (1.30 → 1.31).\n# 컨트롤 플레인\n```\napt-mark unhold kubeadm && apt-get update\napt-get install -y kubeadm=1.31.x-*  && apt-mark hold kubeadm\nkubeadm upgrade plan\nkubeadm upgrade apply v1.31.x\nkubectl drain <cp-node> --ignore-daemonsets\napt-get install -y kubelet=1.31.x-* kubectl=1.31.x-*\nsystemctl daemon-reload && systemctl restart kubelet\nkubectl uncordon <cp-node>\n```\n# 워커 노드\n```\n(컨트롤 플레인에서) kubectl drain <node> --ignore-daemonsets --delete-emptydir-data\n(워커에서)  apt-get install -y kubeadm=1.31.x-*\n            kubeadm upgrade node\n            apt-get install -y kubelet=1.31.x-* ; systemctl daemon-reload ; systemctl restart kubelet\n(컨트롤 플레인에서) kubectl uncordon <node>\n```"}, {"id": "kubeadm-join", "title": "kubeadm 초기화 · 노드 조인 · 토큰", "exams": ["CKA"], "cat": "아키텍처·설치", "tags": ["kubeadm", "join", "init", "token", "조인", "초기화", "cni", "설치"], "body": "```\nkubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address=<IP>\nmkdir -p $HOME/.kube && cp /etc/kubernetes/admin.conf $HOME/.kube/config\nkubectl apply -f <CNI manifest>          # 설치 후 노드가 Ready\nkubeadm token create --print-join-command   # 워커 조인 명령 재생성\n```\n- 사전 조건: swap off, containerd 기동, `br_netfilter` 모듈 및 `net.ipv4.ip_forward=1`\n- 토큰은 기본 24시간 후 만료 → 위 명령으로 재발급\n- 노드가 NotReady 로 남으면 CNI 미설치/kubelet 오류 확인"}, {"id": "node-maint", "title": "노드 관리: cordon · drain · taint", "exams": ["CKA"], "cat": "아키텍처·설치", "tags": ["drain", "cordon", "uncordon", "노드", "유지보수", "evict", "스케줄"], "body": "```\nk cordon node01                       # 새 파드 스케줄만 차단\nk drain node01 --ignore-daemonsets --delete-emptydir-data   # 파드 축출 + cordon\nk uncordon node01\nk get nodes -o wide\n```\n- drain 이 막히는 경우: 단독 파드(컨트롤러 없음) → `--force`, PDB 위반, DaemonSet → `--ignore-daemonsets`\n- 노드 레이블: `k label node node01 disk=ssd` / 제거 `k label node node01 disk-`"}, {"id": "rbac", "title": "RBAC: Role · ClusterRole · Binding", "exams": ["CKA", "CKAD"], "cat": "구성·보안", "tags": ["rbac", "role", "rolebinding", "clusterrole", "serviceaccount", "can-i", "권한", "인가"], "body": "```\nk create role pod-reader --verb=get,list,watch --resource=pods -n dev\nk create rolebinding rb-jane --role=pod-reader --user=jane -n dev\nk create clusterrole node-reader --verb=get,list --resource=nodes\nk create clusterrolebinding crb --clusterrole=node-reader --user=jane\nk create rolebinding sa-rb --role=pod-reader --serviceaccount=dev:build-sa -n dev\nk auth can-i list pods -n dev --as jane\nk auth can-i --list --as system:serviceaccount:dev:build-sa -n dev\n```\n- Role/RoleBinding 은 **네임스페이스 범위**, ClusterRole/ClusterRoleBinding 은 클러스터 범위\n- ClusterRole 을 RoleBinding 으로 묶으면 해당 네임스페이스에만 적용\n- `Forbidden` 에러 → 메시지의 verb/resource/namespace 를 그대로 Role 에 추가"}, {"id": "crd-helm-kustomize", "title": "Helm · Kustomize · CRD", "exams": ["CKA", "CKAD"], "cat": "배포·릴리스", "tags": ["helm", "kustomize", "crd", "operator", "chart", "overlay", "patch", "차트"], "body": "# Helm\n```\nhelm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update\nhelm search repo nginx\nhelm install my-web bitnami/nginx -n web --create-namespace --set replicaCount=2\nhelm upgrade my-web bitnami/nginx -f values.yaml\nhelm rollback my-web 1\nhelm list -A ; helm uninstall my-web -n web\nhelm template my-web bitnami/nginx > out.yaml\nhelm get values my-web\n```\n# Kustomize\n```\n# kustomization.yaml\nresources: [deployment.yaml, service.yaml]\nnamePrefix: dev-\nnamespace: dev\nimages:\n- name: nginx\n  newTag: \"1.27\"\npatches:\n- path: patch.yaml\n```\n`k kustomize ./dir` (미리보기), `k apply -k ./dir`\n# CRD\n`k get crd`, `k explain <kind>`, `k get <plural> -A` — CR 은 CRD 의 plural/shortName 으로 조회"}, {"id": "deploy-rollout", "title": "Deployment 롤링업데이트 · 롤백 · 스케일", "exams": ["CKA", "CKAD"], "cat": "배포·릴리스", "tags": ["deployment", "rollout", "rollback", "undo", "set image", "strategy", "maxSurge", "롤백", "배포", "scale"], "body": "```\nk set image deploy/web nginx=nginx:1.27\nk rollout status deploy/web\nk rollout history deploy/web\nk rollout undo deploy/web [--to-revision=2]\nk rollout pause|resume|restart deploy/web\nk scale deploy web --replicas=5\n```\n```\nspec:\n  strategy:\n    type: RollingUpdate            # 또는 Recreate\n    rollingUpdate: {maxSurge: 25%, maxUnavailable: 25%}\n  revisionHistoryLimit: 10\n```\n- 이미지 변경 이력에 사유를 남기려면 `kubernetes.io/change-cause` annotation 사용\n- 롤아웃이 멈추면 `describe deploy`, ReplicaSet/Pod 이벤트(이미지 오류, 프로브 실패) 확인"}, {"id": "deploy-strategy", "title": "Blue/Green · Canary 배포 (CKAD)", "exams": ["CKAD"], "cat": "배포·릴리스", "tags": ["canary", "blue-green", "bluegreen", "카나리", "블루그린", "릴리스", "selector"], "body": "**Canary**: 같은 Service selector(`app=web`)에 버전 레이블만 다른 두 Deployment 를 두고 replica 비율로 트래픽 분배\n```\nweb-v1: replicas 9  labels {app: web, ver: v1}\nweb-v2: replicas 1  labels {app: web, ver: v2}   # ≈10% 트래픽\nService selector: {app: web}\n```\n**Blue/Green**: 두 Deployment 를 동시 운영하고 Service selector 의 `ver` 값을 전환\n```\nk patch svc web -p '{\"spec\":{\"selector\":{\"app\":\"web\",\"ver\":\"v2\"}}}'\n```\n- 롤백은 selector 를 되돌리거나 `rollout undo`"}, {"id": "sched", "title": "스케줄링: nodeSelector · affinity · taint/toleration", "exams": ["CKA", "CKAD"], "cat": "워크로드·스케줄링", "tags": ["taint", "toleration", "affinity", "nodeselector", "nodename", "스케줄링", "anti-affinity", "topology", "pending"], "body": "```\nk taint nodes node01 key=value:NoSchedule        # 추가\nk taint nodes node01 key=value:NoSchedule-       # 제거 (끝의 - )\nk label node node01 disk=ssd\n```\n```\nspec:\n  nodeSelector: {disk: ssd}\n  tolerations:\n  - {key: key, operator: Equal, value: value, effect: NoSchedule}\n  affinity:\n    nodeAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n        nodeSelectorTerms:\n        - matchExpressions: [{key: disk, operator: In, values: [ssd]}]\n    podAntiAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n      - labelSelector: {matchLabels: {app: web}}\n        topologyKey: kubernetes.io/hostname\n```\n- `nodeName` 지정 시 스케줄러를 우회한다\n- 컨트롤 플레인 노드 기본 taint: `node-role.kubernetes.io/control-plane:NoSchedule`\n- 효과: NoSchedule(신규 차단) / PreferNoSchedule / NoExecute(기존 파드도 축출)"}, {"id": "resources", "title": "리소스 requests/limits · Quota · LimitRange · QoS", "exams": ["CKA", "CKAD"], "cat": "워크로드·스케줄링", "tags": ["resources", "requests", "limits", "quota", "limitrange", "qos", "oom", "cpu", "memory", "리소스"], "body": "```\nresources:\n  requests: {cpu: 100m, memory: 128Mi}\n  limits:   {cpu: 500m, memory: 256Mi}\n```\n```\napiVersion: v1\nkind: ResourceQuota\nmetadata: {name: q, namespace: dev}\nspec:\n  hard: {pods: \"10\", requests.cpu: \"2\", requests.memory: 4Gi, limits.cpu: \"4\"}\n---\napiVersion: v1\nkind: LimitRange\nmetadata: {name: lr, namespace: dev}\nspec:\n  limits:\n  - type: Container\n    default: {cpu: 500m, memory: 256Mi}\n    defaultRequest: {cpu: 100m, memory: 128Mi}\n```\n- QoS: Guaranteed(requests=limits) > Burstable > BestEffort. 메모리 부족 시 BestEffort 부터 축출\n- 메모리 limit 초과 → **OOMKilled**, CPU limit 초과 → 스로틀링\n- Quota 로 requests/limits 를 강제하면 미지정 파드는 생성 거부 → LimitRange 로 기본값 제공\n- 사용량: `k top pod|node` (metrics-server 필요)"}, {"id": "hpa", "title": "HPA (Horizontal Pod Autoscaler)", "exams": ["CKA", "CKAD"], "cat": "워크로드·스케줄링", "tags": ["hpa", "autoscale", "autoscaler", "metrics-server", "오토스케일", "scale"], "body": "```\nk autoscale deploy web --min=2 --max=10 --cpu-percent=50   # 버전에 따라 --cpu=50% 형식\nk get hpa -w\n```\n- 대상 컨테이너에 **cpu requests 가 있어야** 퍼센트 계산 가능, metrics-server 필수\n- `TARGETS <unknown>/50%` → metrics-server 미설치 또는 requests 미설정\n- 축소 안정화 기본 5분 (`behavior.scaleDown.stabilizationWindowSeconds`)"}, {"id": "static-ds", "title": "DaemonSet · Static Pod", "exams": ["CKA"], "cat": "워크로드·스케줄링", "tags": ["daemonset", "static pod", "staticpod", "manifests", "kubelet", "스태틱"], "body": "# Static Pod\n- kubelet 이 `/etc/kubernetes/manifests` (설정 `staticPodPath` in `/var/lib/kubelet/config.yaml`)의 YAML 을 직접 실행\n- 파드 이름에 노드명이 붙는다 (예: `web-node01`). API 서버에서 삭제해도 재생성 → **파일을 지워야** 삭제됨\n```\nk run static-web --image=nginx $do > /etc/kubernetes/manifests/static-web.yaml\n```\n- 컨트롤 플레인 컴포넌트(apiserver, etcd, scheduler, controller-manager)도 static pod\n# DaemonSet\n- 노드마다 1개 파드 (로그/모니터링 에이전트). `kind: DaemonSet`, `replicas` 없음\n- 컨트롤 플레인에도 올리려면 toleration 필요"}, {"id": "pod-multi", "title": "멀티 컨테이너 · initContainer · Sidecar", "exams": ["CKAD"], "cat": "워크로드·스케줄링", "tags": ["sidecar", "initcontainer", "init", "multi-container", "emptydir", "adapter", "ambassador", "사이드카"], "body": "```\nspec:\n  initContainers:\n  - name: wait-db\n    image: busybox\n    command: ['sh','-c','until nslookup db; do sleep 2; done']\n  containers:\n  - {name: app, image: nginx, volumeMounts: [{name: logs, mountPath: /var/log/nginx}]}\n  - {name: shipper, image: busybox, command: ['sh','-c','tail -F /logs/access.log'], volumeMounts: [{name: logs, mountPath: /logs}]}\n  volumes:\n  - {name: logs, emptyDir: {}}\n```\n- initContainer 는 순차 실행, 모두 성공해야 앱 컨테이너 시작\n- 네이티브 사이드카(v1.29+): `initContainers` 항목에 `restartPolicy: Always`\n- 컨테이너 선택: `k logs pod -c shipper`, `k exec -it pod -c app -- sh`"}, {"id": "job-cron", "title": "Job · CronJob", "exams": ["CKAD"], "cat": "워크로드·스케줄링", "tags": ["job", "cronjob", "completions", "parallelism", "backoffLimit", "schedule", "배치"], "body": "```\nk create job pi --image=perl -- perl -Mbignum=bpi -wle 'print bpi(2000)'\nk create cronjob hello --image=busybox --schedule=\"*/1 * * * *\" -- date\nk create job manual-run --from=cronjob/hello\n```\n```\nspec:                       # Job\n  completions: 5\n  parallelism: 2\n  backoffLimit: 4\n  activeDeadlineSeconds: 120\n  ttlSecondsAfterFinished: 60\n  template: {spec: {restartPolicy: Never, containers: [...]}}   # Never 또는 OnFailure\n# CronJob 추가 필드\n  concurrencyPolicy: Forbid   # Allow | Forbid | Replace\n  successfulJobsHistoryLimit: 3\n  failedJobsHistoryLimit: 1\n```"}, {"id": "cm-secret", "title": "ConfigMap · Secret 주입", "exams": ["CKAD", "CKA"], "cat": "구성·보안", "tags": ["configmap", "secret", "env", "envfrom", "volume", "구성", "환경변수", "시크릿"], "body": "```\nk create cm app --from-literal=MODE=prod --from-file=app.properties\nk create secret generic db --from-literal=password=s3cr3t\nk create secret docker-registry reg --docker-server=... --docker-username=... --docker-password=...\n```\n```\ncontainers:\n- name: app\n  envFrom: [{configMapRef: {name: app}}]\n  env:\n  - name: DB_PASS\n    valueFrom: {secretKeyRef: {name: db, key: password}}\n  volumeMounts: [{name: cfg, mountPath: /etc/app}]\nvolumes:\n- name: cfg\n  configMap: {name: app}        # 키가 파일로 마운트됨\n```\n- env 로 주입한 값은 **파드 재시작 전에는 갱신되지 않음**, 볼륨 마운트는 자동 갱신(subPath 제외)\n- Secret 은 base64 **인코딩**일 뿐 암호화가 아님 → `echo -n val | base64`, 확인 `base64 -d`\n- `CreateContainerConfigError` → 참조한 ConfigMap/Secret/key 오타 확인"}, {"id": "secctx-sa", "title": "SecurityContext · ServiceAccount", "exams": ["CKAD", "CKA"], "cat": "구성·보안", "tags": ["securitycontext", "runasuser", "serviceaccount", "capabilities", "privileged", "fsgroup", "보안"], "body": "```\nspec:\n  serviceAccountName: build-sa\n  automountServiceAccountToken: false\n  securityContext: {runAsUser: 1000, runAsGroup: 3000, fsGroup: 2000}   # 파드 수준\n  containers:\n  - name: app\n    image: nginx\n    securityContext:                                                    # 컨테이너 수준(우선)\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      runAsNonRoot: true\n      capabilities: {drop: [\"ALL\"], add: [\"NET_BIND_SERVICE\"]}\n```\n```\nk create sa build-sa\nk create token build-sa          # 단기 토큰 발급 (v1.24+)\nk set serviceaccount deploy/web build-sa\n```\n- 컨테이너 수준 설정이 파드 수준 설정을 덮어쓴다"}, {"id": "service", "title": "Service 타입과 Endpoint 점검", "exams": ["CKA", "CKAD"], "cat": "서비스·네트워킹", "tags": ["service", "clusterip", "nodeport", "loadbalancer", "headless", "externalname", "endpoints", "selector", "서비스"], "body": "```\nk expose deploy web --port=80 --target-port=8080 --type=ClusterIP\nk get svc,endpoints,endpointslices -o wide\n```\n- ClusterIP(내부) / NodePort(30000-32767) / LoadBalancer / ExternalName(CNAME) / Headless(`clusterIP: None`, DNS 가 파드 IP 반환)\n- **Endpoints 가 비어 있으면** selector↔파드 label 불일치 또는 readiness 실패\n- `port`(서비스 포트) vs `targetPort`(컨테이너 포트) 혼동 주의\n- 내부 접근 테스트: `k run t --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- svc.ns:80`"}, {"id": "ingress", "title": "Ingress · Gateway API", "exams": ["CKA", "CKAD"], "cat": "서비스·네트워킹", "tags": ["ingress", "gateway", "httproute", "ingressclass", "tls", "path", "인그레스"], "body": "```\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata: {name: web}\nspec:\n  ingressClassName: nginx\n  rules:\n  - host: foo.com\n    http:\n      paths:\n      - {path: /app, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}\n```\n```\nk create ingress web --class=nginx --rule=\"foo.com/app*=web:80\" $do\nk get ingressclass ; k describe ingress web\n```\n- `ingressClassName` 누락 시 동작 안 함, Ingress Controller 가 설치돼 있어야 함\n- **Gateway API**: `GatewayClass` → `Gateway`(listener) → `HTTPRoute`(parentRefs, rules[].backendRefs) 구조\n- 확인: `k get gateway,httproute`"}, {"id": "netpol", "title": "NetworkPolicy", "exams": ["CKA", "CKAD"], "cat": "서비스·네트워킹", "tags": ["networkpolicy", "network policy", "ingress", "egress", "podselector", "namespaceselector", "네트워크정책", "방화벽"], "body": "```\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: db-allow, namespace: prod}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress, Egress]\n  ingress:\n  - from:\n    - podSelector: {matchLabels: {app: api}}\n    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: staging}}\n    ports: [{protocol: TCP, port: 5432}]\n  egress:\n  - to: [{namespaceSelector: {}}]\n    ports: [{protocol: UDP, port: 53}]       # DNS 허용 필수\n```\n- `from` 안에서 **같은 항목(-) 내 selector 는 AND**, **항목이 나뉘면 OR** (가장 흔한 함정)\n- policyTypes 에 명시한 방향은 허용 규칙이 없으면 **전부 차단**. 빈 `podSelector: {}` = 네임스페이스 전체 파드\n- egress 제한 시 DNS(UDP/TCP 53) 허용을 잊지 말 것\n- CNI 가 NetworkPolicy 를 지원해야 함 (Calico, Cilium 등)"}, {"id": "dns", "title": "클러스터 DNS / CoreDNS", "exams": ["CKA", "CKAD"], "cat": "서비스·네트워킹", "tags": ["dns", "coredns", "nslookup", "resolv", "svc.cluster.local", "kube-dns", "이름해석"], "body": "```\nk -n kube-system get pods -l k8s-app=kube-dns\nk -n kube-system logs -l k8s-app=kube-dns\nk -n kube-system get cm coredns -o yaml\nk run t --rm -it --image=busybox:1.36 --restart=Never -- nslookup kubernetes.default\n```\n- 서비스: `<svc>.<ns>.svc.cluster.local`, 파드: `<ip-with-dashes>.<ns>.pod.cluster.local`\n- 파드의 `/etc/resolv.conf` 에 nameserver(kube-dns ClusterIP)와 search 도메인 확인\n- CoreDNS 가 CrashLoop → Corefile 의 `loop`, upstream resolver(`/etc/resolv.conf` of node) 문제 확인"}, {"id": "pv-pvc", "title": "PV · PVC · StorageClass", "exams": ["CKA", "CKAD"], "cat": "스토리지", "tags": ["pv", "pvc", "storageclass", "persistentvolume", "accessmodes", "reclaim", "hostpath", "볼륨", "스토리지"], "body": "```\napiVersion: v1\nkind: PersistentVolume\nmetadata: {name: pv1}\nspec:\n  capacity: {storage: 1Gi}\n  accessModes: [ReadWriteOnce]\n  persistentVolumeReclaimPolicy: Retain\n  storageClassName: manual\n  hostPath: {path: /mnt/data}\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: pvc1}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  resources: {requests: {storage: 500Mi}}\n```\n```\n# 파드에서 사용\nvolumes: [{name: data, persistentVolumeClaim: {claimName: pvc1}}]\n```\n- PVC 가 **Pending**: storageClassName/accessModes/용량 불일치, 가용 PV 없음, `volumeBindingMode: WaitForFirstConsumer` (파드 생성 후 바인딩)\n- accessModes: RWO / ROX / RWX / RWOP. reclaimPolicy: Retain / Delete\n- 확장: StorageClass 에 `allowVolumeExpansion: true` 이면 PVC `requests.storage` 증가\n- 기본 SC 지정: annotation `storageclass.kubernetes.io/is-default-class: \"true\"`"}, {"id": "probes", "title": "Liveness · Readiness · Startup 프로브", "exams": ["CKAD", "CKA"], "cat": "관찰·디버깅", "tags": ["probe", "liveness", "readiness", "startup", "healthcheck", "프로브", "헬스체크"], "body": "```\nlivenessProbe:\n  httpGet: {path: /healthz, port: 8080}\n  initialDelaySeconds: 10\n  periodSeconds: 5\n  failureThreshold: 3\nreadinessProbe:\n  exec: {command: [cat, /tmp/ready]}\nstartupProbe:\n  tcpSocket: {port: 8080}\n  failureThreshold: 30\n  periodSeconds: 10\n```\n- **liveness 실패 → 컨테이너 재시작**, **readiness 실패 → Service 엔드포인트에서 제외**(재시작 안 함), startup 은 성공 전까지 다른 프로브 보류\n- 프로브 실패 확인: `k describe pod` Events (`Liveness probe failed: ...`)\n- 느린 앱에 liveness 를 너무 빡빡하게 두면 CrashLoop → startupProbe 사용"}, {"id": "logs-debug", "title": "로그 · exec · port-forward · debug · top", "exams": ["CKA", "CKAD"], "cat": "관찰·디버깅", "tags": ["logs", "exec", "port-forward", "debug", "top", "events", "describe", "로그", "디버깅", "metrics"], "body": "```\nk logs pod -f --tail=50 [-c container] [--previous] [-l app=web --all-containers]\nk exec -it pod -- sh\nk port-forward svc/web 8080:80\nk describe pod pod | sed -n '/Events/,$p'\nk get events -A --sort-by=.metadata.creationTimestamp\nk top pod -A --sort-by=memory ; k top node\nk debug -it pod --image=busybox:1.36 --target=app      # 임시 디버그 컨테이너\nk debug node/node01 -it --image=busybox                # 노드 디버그 (호스트 /host)\nk cp pod:/path/file ./file\n```\n- `--previous` : 직전에 죽은 컨테이너 로그 (CrashLoopBackOff 필수 명령)\n- API deprecation 점검: `k api-versions`, `k explain`, `k convert` (플러그인)"}, {"id": "ts-pod", "title": "Pod 상태별 트러블슈팅 표", "exams": ["CKA", "CKAD"], "cat": "트러블슈팅", "tags": ["pending", "crashloopbackoff", "imagepullbackoff", "oomkilled", "evicted", "createcontainerconfigerror", "error", "파드", "장애"], "body": "| 상태 | 주요 원인 | 확인/조치 |\n|---|---|---|\n| Pending | 스케줄 불가(리소스·taint·affinity), PVC 미바인딩 | `describe pod` Events, `describe node`, `get pvc` |\n| ImagePullBackOff / ErrImagePull | 이미지명/태그 오타, 레지스트리 인증 | `describe pod`, imagePullSecrets, `crictl pull` |\n| CrashLoopBackOff | 앱 에러, 잘못된 command/args, 프로브 실패, OOM | `logs --previous`, `describe` Last State/Exit Code |\n| CreateContainerConfigError | ConfigMap/Secret/key 없음 | 참조 이름 확인 |\n| OOMKilled (Exit 137) | 메모리 limit 초과 | limit 상향/누수 점검 |\n| Evicted | 노드 자원 압박(disk/memory) | `describe node` Conditions |\n| Running 이지만 접속 불가 | readiness 실패, Service selector/포트 불일치 | `get endpoints`, `describe svc` |\n| Terminating 정체 | finalizer, 노드 다운 | `k delete pod x --force --grace-period=0` |\n```\nk get pod -o wide ; k describe pod x ; k logs x --previous ; k get events --sort-by=.metadata.creationTimestamp\n```"}, {"id": "ts-node", "title": "노드 NotReady 트러블슈팅", "exams": ["CKA"], "cat": "트러블슈팅", "tags": ["notready", "node", "kubelet", "containerd", "노드", "swap", "cni", "certificate"], "body": "```\nk get nodes ; k describe node node01      # Conditions: Ready, MemoryPressure, DiskPressure, PIDPressure\nssh node01\nsystemctl status kubelet ; journalctl -u kubelet -f --no-pager | tail -50\nsystemctl status containerd ; crictl ps -a\n```\n체크리스트\n1. kubelet 미기동 → `systemctl enable --now kubelet`\n2. kubelet 설정 오류: `/var/lib/kubelet/config.yaml`, `/etc/kubernetes/kubelet.conf`(apiserver 주소/인증서 경로), drop-in `/etc/systemd/system/kubelet.service.d/10-kubeadm.conf`\n3. 설정 변경 후 `systemctl daemon-reload &&  "로그", "deprecated", "애플리케이션"], "body": "1. `k get pods` 상태 확인 → 표(Pod 상태별 트러블슈팅) 로 원인 분류\n2. `k logs <pod> [-c c] [--previous]`, `k describe pod`\n3. 구성 문제: env/ConfigMap/Secret 참조, 볼륨 마운트 경로, command/args 오타\n4. 네트워크 문제: Service selector/port, NetworkPolicy, Ingress\n5. 리소스 문제: limits(OOMKilled), Quota 초과 (`k describe quota -n ns`)\n6. 수정은 `k edit` 또는 YAML 수정 후 `k replace --force -f pod.yaml` (파드의 불변 필드 변경 시)\n- `k get deploy,rs,pod -l app=web` 으로 계층을 한눈에 확인"}], "exams": {"CKA": {"name": "Certified Kubernetes Administrator", "domains": [["트러블슈팅", 30], ["클러스터 아키텍처·설치·구성", 25], ["서비스·네트워킹", 20], ["워크로드·스케줄링", 15], ["스토리지", 10]]}, "CKAD": {"name": "Certified Kubernetes Application Developer", "domains": [["환경·구성·보안", 25], ["애플리케이션 설계·빌드", 20], ["애플리케이션 배포", 20], ["서비스·네트워킹", 20], ["관찰·유지보수", 15]]}}, "cats": ["시험 팁", "아키텍처·설치", "워크로드·스케줄링", "서비스·네트워킹", "스토리지", "구성·보안", "배포·릴리스", "관찰·디버깅", "트러블슈팅"]}</script>
<script>
/* DocSolver 단독 실행용: server.py 의 /api/* 를 브라우저 안에서 구현한다. (build_html.py 가 index.html 에 주입)
   - 파일은 이 브라우저의 IndexedDB 에만 저장되며 외부로 전송되지 않는다 (AI 분석을 켠 경우 제외). */
(() => {
const D = JSON.parse(document.getElementById('ds-data').textContent);
const RULES = D.rules.map(r => ({...r, rx: new RegExp(r.re, 'i')}));
const SEV = {high: 0, medium: 1, low: 2};
const _fetch = window.fetch.bind(window);
const CFG = {key: ''};
const MAX_BYTES = 20 * 1024 * 1024, CHUNK_LINES = 14, OVERLAP = 3, CHUNK_CHARS = 1400;

/* 줄 분리: 파일 끝 개행 뒤의 빈 줄은 제외 (Python str.splitlines 와 동일) */
const splitLines = t => { const a = t.split(/\r?\n/); if (a.length && a[a.length - 1] === '') a.pop(); return a; };

/* ---------- 토크나이저 / BM25 ---------- */
function tokenize(t) {
  t = t.toLowerCase();
  const out = t.match(/[a-z0-9_]+/g) || [];
  for (const w of (t.match(/[가-힣]+/g) || [])) {
    if (w.length === 1) out.push(w);
    else for (let i = 0; i < w.length - 1; i++) out.push(w.slice(i, i + 2));
  }
  return out;
}
const counter = a => { const m = new Map(); for (const x of a) m.set(x, (m.get(x) || 0) + 1); return m; };
function bm25(tf, len, qset, N, df, avg, k1, b) {
  let s = 0;
  for (const t of qset) {
    const f = tf.get(t); if (!f) continue;
    const d = df.get(t) || 0, idf = Math.log(1 + (N - d + 0.5) / (d + 0.5));
    s += idf * f * (k1 + 1) / (f + k1 * (1 - b + b * len / avg));
  }
  return s;
}

/* ---------- 업로드 파일 인덱스 ---------- */
const files = new Map();
let chunks = [], df = new Map(), avg = 1;
function rebuild() {
  chunks = []; df = new Map();
  for (const [name, f] of files) {
    const lines = f.lines; let i = 0;
    while (i < lines.length) {
      let j = i, size = 0;
      while (j < lines.length && (j - i < CHUNK_LINES) && size < CHUNK_CHARS) { size += lines[j].length + 1; j++; }
      j = Math.max(j, i + 1);
      const text = lines.slice(i, j).join('\n'), toks = tokenize(text);
      chunks.push({file: name, start: i + 1, end: j, text, tf: counter(toks), len: toks.length || 1});
      if (j >= lines.length) break;
      i = Math.max(j - OVERLAP, i + 1);
    }
  }
  for (const c of chunks) for (const k of c.tf.keys()) df.set(k, (df.get(k) || 0) + 1);
  avg = chunks.length ? chunks.reduce((a, c) => a + c.len, 0) / chunks.length : 1;
}
function search(q, k = 8) {
  const qs = new Set(tokenize(q)); if (!qs.size) return [];
  const out = [];
  for (const c of chunks) { const s = bm25(c.tf, c.len, qs, chunks.length, df, avg, 1.5, 0.75); if (s > 0) out.push([s, c]); }
  out.sort((a, b) => b[0] - a[0]);
  const top = out.length ? out[0][0] : 1;
  return out.slice(0, k).map(([s, c]) => ({file: c.file, start: c.start, end: c.end, text: c.text, score: Math.round(s / top * 100)}));
}

/* ---------- 장애 패턴 탐지 ---------- */
function fmtFindings(items) {
  const r = items.map(e => ({id: e.rule.id, title: e.rule.title, severity: e.rule.severity, cause: e.rule.cause,
    solutions: e.rule.solutions, count: e.count, examples: e.examples}));
  r.sort((a, b) => SEV[a.severity] - SEV[b.severity] || b.count - a.count);
  return r;
}
function scan() {
  const found = new Map();
  for (const [name, f] of files) f.lines.forEach((line, idx) => {
    for (const r of RULES) if (r.rx.test(line)) {
      let e = found.get(r.id);
      if (!e) { e = {rule: r, count: 0, examples: []}; found.set(r.id, e); }
      e.count++;
      if (e.examples.length < 4) e.examples.push({file: name, line: idx + 1, text: line.trim().slice(0, 300)});
    }
  });
  return fmtFindings([...found.values()]);
}
function matchText(text, src) {
  const f = new Map();
  for (const r of RULES) { const m = text.match(r.rx); if (m) f.set(r.id, {rule: r, count: 1, examples: [{file: src, line: 0, text: m[0].slice(0, 300)}]}); }
  return f;
}

/* ---------- CKA/CKAD 노트 ---------- */
const NDOCS = D.notes.map(n => {
  const text = (n.title + ' ').repeat(3) + (n.tags.join(' ') + ' ').repeat(2) + n.body;
  const toks = tokenize(text);
  return {n, tf: counter(toks), len: toks.length || 1, low: text.toLowerCase()};
});
const NDF = new Map();
for (const d of NDOCS) for (const k of d.tf.keys()) NDF.set(k, (NDF.get(k) || 0) + 1);
const NAVG = NDOCS.reduce((a, d) => a + d.len, 0) / NDOCS.length;
function searchNotes(q, exam, cat) {
  let pool = NDOCS.filter(d => !exam || d.n.exams.includes(exam));
  const cats = new Map(); for (const d of pool) cats.set(d.n.cat, (cats.get(d.n.cat) || 0) + 1);
  pool = pool.filter(d => !cat || d.n.cat === cat);
  q = q.trim();
  if (!q) return [pool.map(d => [d.n, null]), cats];
  const qs = new Set(tokenize(q)), out = [];
  for (const d of pool) {
    let s = bm25(d.tf, d.len, qs, NDOCS.length, NDF, NAVG, 1.4, 0.75);
    if (d.low.includes(q.toLowerCase())) s += 2.0;
    if (s > 0) out.push([s, d.n]);
  }
  out.sort((a, b) => b[0] - a[0]);
  const top = out.length ? out[0][0] : 1;
  return [out.map(([s, n]) => [n, Math.round(s / top * 100)]), cats];
}

/* ---------- AI 분석 (브라우저에서 Anthropic API 직접 호출) ---------- */
function ctxOf(ex, radius = 4) {
  const f = files.get(ex.file);
  if (!f || !ex.line) return ex.text;
  return f.lines.slice(Math.max(0, ex.line - 1 - radius), ex.line + radius).join('\n');
}
async function aiAnswer(query, hits, findings) {
  if (!CFG.key) return null;
  const ctx = hits.slice(0, 5).map(h => `[${h.file}:${h.start}-${h.end}]\n${h.text.slice(0, 1500)}`).join('\n\n');
  const fnd = findings.slice(0, 6).map(f => `- ${f.title} (${f.count}건)`).join('\n');
  const prompt = `아래는 사용자가 업로드한 파일에서 검색된 발췌와 자동 탐지된 이슈입니다.\n질문/증상: ${query || '(없음 - 전체 파일 점검)'}\n\n탐지된 이슈:\n${fnd || '(없음)'}\n\n발췌:\n${ctx}\n\n` +
    '한국어로 (1) 원인 추정 (2) 단계별 해결 방법(명령어 포함) (3) 재발 방지 순으로 간결하게 답하세요. 발췌에 근거가 없는 내용은 추측임을 밝히세요.';
  try {
    const r = await _fetch('https://api.anthropic.com/v1/messages', {method: 'POST',
      headers: {'x-api-key': CFG.key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json',
                'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: 'claude-sonnet-5-5', max_tokens: 1500, messages: [{role: 'user', content: prompt}]})});
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    return j.content.map(b => b.text || '').join('');
  } catch (e) { return `(AI 답변 실패: ${e.message})`; }
}

/* ---------- 파일 읽기 ---------- */
async function docx(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('docx 형식 오류');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true),
          xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    if (new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl)) === 'word/document.xml') {
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true), data = u8.subarray(start, start + csz);
      const xml = method === 0 ? new TextDecoder().decode(data)
        : await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      return xml.replace(/<\/w:p>/g, '\n').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    }
    p += 46 + nl + xl + cl;
  }
  throw new Error('docx 본문을 찾을 수 없습니다');
}
async function extract(name, buf) {
  const ext = name.split('.').pop().toLowerCase();
  if (ext === 'docx') return docx(buf);
  if (ext === 'pdf') throw new Error('PDF 는 HTML 단독 버전에서 지원하지 않습니다 (서버 버전 + pypdf 사용).');
  const u8 = new Uint8Array(buf);
  if (u8.subarray(0, 4096).includes(0)) throw new Error('지원하지 않는 바이너리 파일입니다.');
  try { return new TextDecoder('utf-8', {fatal: true}).decode(u8).replace(/^﻿/, ''); }
  catch { try { return new TextDecoder('euc-kr').decode(u8); } catch { return new TextDecoder('latin1').decode(u8); } }
}

/* ---------- IndexedDB 저장 ---------- */
const dbp = new Promise(res => {
  try {
    const rq = indexedDB.open('docsolver', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('files', {keyPath: 'name'});
    rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
  } catch { res(null); }
});
const dbAll = async () => { const db = await dbp; if (!db) return [];
  return new Promise(r => { const q = db.transaction('files').objectStore('files').getAll(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); }); };
const dbPut = async rec => { const db = await dbp; if (db) db.transaction('files', 'readwrite').objectStore('files').put(rec); };
const dbDel = async name => { const db = await dbp; if (db) db.transaction('files', 'readwrite').objectStore('files').delete(name); };
const ready = (async () => {
  for (const r of await dbAll()) files.set(r.name, {lines: splitLines(r.text), size: r.size});
  rebuild();
})();

/* ---------- /api/* 라우터 ---------- */
const J = (o, s = 200) => new Response(JSON.stringify(o), {status: s, headers: {'content-type': 'application/json'}});
window.fetch = async (url, init = {}) => {
  if (typeof url !== 'string' || !url.startsWith('/api/')) return _fetch(url, init);
  await ready;
  const u = new URL(url, 'http://x'), method = (init.method || 'GET').toUpperCase(), path = u.pathname;
  const body = () => { try { return JSON.parse(init.body || '{}'); } catch { return {}; } };

  if (path === '/api/files' && method === 'GET')
    return J({files: [...files].map(([name, f]) => ({name, size: f.size, lines: f.lines.length})), ai: !!CFG.key});
  if (path === '/api/files' && method === 'DELETE') {
    const name = u.searchParams.get('name') || '';
    files.delete(name); await dbDel(name); rebuild(); return J({ok: true});
  }
  if (path === '/api/config') { CFG.key = (body().key || '').trim(); return J({ok: true, ai: !!CFG.key}); }
  if (path === '/api/scan') return J({findings: scan()});
  if (path === '/api/upload') {
    const h = init.headers || {};
    const name = decodeURIComponent(h['X-Filename'] || '').split(/[\\/]/).pop() || 'unnamed.txt';
    const buf = await init.body.arrayBuffer();
    if (buf.byteLength > MAX_BYTES) return J({error: '파일이 너무 큽니다 (최대 20MB)'}, 413);
    let text; try { text = await extract(name, buf); } catch (e) { return J({error: `${name}: ${e.message}`}, 400); }
    files.set(name, {lines: splitLines(text), size: buf.byteLength});
    await dbPut({name, text, size: buf.byteLength}); rebuild();
    return J({ok: true, name, lines: files.get(name).lines.length});
  }
  if (path === '/api/search') {
    const b = body(), q = (b.q || '').trim(), hits = q ? search(q) : [];
    const found = new Map();
    if (q) for (const [k, v] of matchText(q, '질문')) found.set(k, v);
    for (const h of hits.slice(0, 5)) for (const [k, v] of matchText(h.text, `${h.file}:${h.start}`)) {
      if (found.has(k)) found.get(k).count++; else found.set(k, v);
    }
    const findings = fmtFindings([...found.values()]);
    const ai = b.ai ? await aiAnswer(q, hits, findings) : null;
    return J({hits, findings, ai, terms: [...new Set(tokenize(q))].sort()});
  }
  if (path === '/api/ai-scan') {
    const f = scan(), hits = [];
    for (const x of f.slice(0, 4)) for (const ex of x.examples.slice(0, 2))
      hits.push({file: ex.file, start: ex.line, end: ex.line, text: ctxOf(ex)});
    return J({ai: await aiAnswer('', hits, f)});
  }
  if (path === '/api/notes') {
    const q = u.searchParams.get('q') || '', exam = D.exams[u.searchParams.get('exam')] ? u.searchParams.get('exam') : '',
          cat = u.searchParams.get('cat') || '';
    const [found, cats] = searchNotes(q, exam, cat);
    const mine = q.trim() && files.size ? search(q, 4) : [];
    return J({notes: found.map(([n, sc]) => ({id: n.id, title: n.title, exams: n.exams, cat: n.cat, body: n.body, score: sc})),
      mine, terms: [...new Set(tokenize(q))].sort(),
      meta: {cats: D.cats.filter(c => cats.get(c)).map(c => ({name: c, count: cats.get(c)})), exams: D.exams, total: D.notes.length}});
  }
  return J({error: 'not found'}, 404);
};
})();

function hl(text){
  let h=esc(text);
  const w=terms.filter(t=>/^[a-z0-9_]{2,}$/.test(t)||/^[가-힣]{2}$/.test(t));
  if(!w.length)return h;
  return h.replace(new RegExp('('+w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>');
}
function tblHtml(rows){
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const [h,...t]=rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));
  return `<table><thead><tr>${cells(h).map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${t.map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code class="cp" title="클릭하여 복사">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function mdBlock(src){
  return src.split(/```[a-z]*\n?/).map((p,i)=>{
    if(i%2)return `<pre><button class="copy">복사</button><code>${esc(p.replace(/\n$/,''))}</code></pre>`;
    const o=[];let tb=[];let list=null;const close=()=>{if(list){o.push(`</${list}>`);list=null}};
    for(const l of p.split('\n')){let m;
      if(/^\s*\|.*\|\s*$/.test(l)){close();tb.push(l);continue}
      if(tb.length){o.push(tblHtml(tb));tb=[]}
      if(m=l.match(/^#{1,4}\s+(.*)/)){close();o.push(`<h4>${inl(m[1])}</h4>`)}
      else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();o.push('<ul>');list='ul'}o.push(`<li>${inl(m[1])}</li>`)}
      else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();o.push('<ol>');list='ol'}o.push(`<li>${inl(m[1])}</li>`)}
      else{close();if(l.trim())o.push(`<div>${inl(l)}</div>`)}}
    close();if(tb.length)o.push(tblHtml(tb));return o.join('');
  }).join('');
}

  if(nBm&&!BM.has(id))notes();
});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
loadFiles().then(empty);
</script>
