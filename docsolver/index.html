<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocSolver</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface2:#f8fafc;--tx:#0f172a;--tx2:#475569;--mute:#8492a6;--line:#e2e8f0;
  --pri:#4f46e5;--pri-soft:#eef2ff;--pri-tx:#fff;
  --hi:#dc2626;--hi-bg:#fef2f2;--md:#d97706;--md-bg:#fffbeb;--lo:#16a34a;--lo-bg:#f0fdf4;
  --code:#f1f5f9;--mark:#fef08a;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);--r:14px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1020;--surface:#141a2e;--surface2:#10162a;--tx:#e8ecf6;--tx2:#aab4c8;--mute:#7482a0;--line:#25304a;
  --pri:#818cf8;--pri-soft:#1c2347;--pri-tx:#0b1020;
  --hi:#f87171;--hi-bg:#2a1418;--md:#fbbf24;--md-bg:#2a2210;--lo:#4ade80;--lo-bg:#10251a;
  --code:#0d1326;--mark:#6b5b12;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.mono,code,pre{font-family:ui-monospace,"JetBrains Mono","D2Coding",Menlo,Consolas,monospace}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.hd h1{font-size:18px;margin:0;letter-spacing:-.3px}
.hd .tag{color:var(--mute);font-size:13px;display:none}
@media(min-width:720px){.hd .tag{display:block}}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--tx2);border-radius:99px;padding:5px 12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.pill.on .dot{background:var(--lo);box-shadow:0 0 0 3px color-mix(in srgb,var(--lo) 25%,transparent)}

/* ---------- layout ---------- */
.app{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
@media(max-width:900px){
  aside{display:contents}
  .up{order:1}main{order:2}.aibox{order:3}
  #drop{padding:14px 10px}#drop .ic{display:none}.files{max-height:160px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.ttl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}

/* ---------- upload ---------- */
#drop{border:2px dashed var(--line);border-radius:12px;background:var(--surface2);padding:22px 14px;text-align:center;cursor:pointer;transition:.15s}
#drop:hover,#drop.on{border-color:var(--pri);background:var(--pri-soft)}
#drop .ic{font-size:28px;line-height:1}
#drop b{display:block;margin-top:6px}
#drop small{color:var(--mute);font-size:12.5px}
.files{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.file .fi{font-size:18px}
.file .fn{flex:1;min-width:0}
.file .fn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fn span{font-size:12px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);width:26px;height:26px;border-radius:6px;font-size:16px}
.x:hover{background:var(--hi-bg);color:var(--hi)}
.nofile{color:var(--mute);font-size:13px;text-align:center;padding:8px 0 0}
.link{background:none;border:0;color:var(--pri);padding:0;font-size:13px;font-weight:600}
.link:hover{text-decoration:underline}

/* ---------- ai settings ---------- */
.aibox label.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.switch i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--pri)}
.switch input:checked+i:after{transform:translateX(18px)}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+i{opacity:.5}
.keyrow{display:flex;gap:6px;margin-top:10px}
.keyrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--tx);font-size:13px}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}

/* ---------- buttons / search ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--tx);border-radius:10px;padding:0 16px;height:44px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.08);color:var(--pri-tx)}
.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.searchbar{position:sticky;top:64px;z-index:10;padding:12px;margin-bottom:16px}
@media(max-width:900px){.searchbar{top:60px}}
.sbrow{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1;min-width:200px;position:relative}
.field span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.field input{width:100%;height:44px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--tx);font-size:15px}
.field input:focus{outline:2px solid var(--pri);border-color:transparent;background:var(--surface)}
.field kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px;color:var(--mute);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chips small{color:var(--mute);font-size:12.5px;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--tx2);border-radius:99px;padding:2px 11px;font-size:12.5px}
.chip:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}

/* ---------- results ---------- */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.sum{grid-template-columns:repeat(2,1fr)}}
.tile{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tile b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.5px}
.tile span{font-size:12.5px;color:var(--tx2)}
.tile.hi{background:var(--hi-bg);border-color:transparent}.tile.hi b{color:var(--hi)}
.tile.md{background:var(--md-bg);border-color:transparent}.tile.md b{color:var(--md)}
.tile.lo{background:var(--lo-bg);border-color:transparent}.tile.lo b{color:var(--lo)}
h2.sec{font-size:15px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec .n{background:var(--pri-soft);color:var(--pri);border-radius:99px;padding:0 9px;font-size:12.5px}

details.fd{border-left:4px solid var(--mute);margin-bottom:12px;overflow:hidden}
details.fd.high{border-left-color:var(--hi)}details.fd.medium{border-left-color:var(--md)}details.fd.low{border-left-color:var(--lo)}
details.fd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px}
details.fd summary::-webkit-details-marker{display:none}
details.fd summary:hover{background:var(--surface2)}
.sev{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.sev.high{background:var(--hi-bg);color:var(--hi)}.sev.medium{background:var(--md-bg);color:var(--md)}.sev.low{background:var(--lo-bg);color:var(--lo)}
.fd .ft{font-weight:700;flex:1;min-width:0}
.fd .cnt{font-size:12.5px;color:var(--mute);white-space:nowrap}
.chev{transition:.15s;color:var(--mute)}details[open] .chev{transform:rotate(90deg)}
.fb{padding:0 16px 16px}
.cause{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--tx2);margin-bottom:12px}
.cause b{color:var(--tx)}
.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 4px;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
code.cp{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;cursor:copy;word-break:break-word}
code.cp:hover{border-color:var(--pri);color:var(--pri)}
.ev{margin-top:14px}
.ev h4{margin:0 0 6px;font-size:12px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.evi{display:flex;gap:8px;font-size:12.5px;background:var(--code);border-radius:8px;padding:6px 10px;margin-bottom:4px;align-items:baseline}
.evi .loc{color:var(--pri);font-weight:600;white-space:nowrap}
.evi .tx{word-break:break-all;color:var(--tx2)}

.ai-card{border:1px solid color-mix(in srgb,var(--pri) 40%,var(--line));background:linear-gradient(180deg,var(--pri-soft),var(--surface) 70px)}
.ans{padding:4px 18px 16px;font-size:14.5px}
.ans h4{margin:14px 0 4px;font-size:15px}.ans ul,.ans ol{margin:4px 0;padding-left:22px}.ans li{margin:2px 0}
.ans pre,.hit pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12.5px;margin:8px 0;line-height:1.55}
.ans code{background:var(--code);border-radius:5px;padding:0 5px;font-size:13px}
.ans .ph{padding:14px 18px 0;font-weight:700;display:flex;align-items:center;gap:8px}
.copy{position:absolute;right:8px;top:8px;border:1px solid var(--line);background:var(--surface);color:var(--tx2);border-radius:6px;font-size:11.5px;padding:1px 8px}
.copy:hover{color:var(--pri);border-color:var(--pri)}

.hit{margin-bottom:12px;overflow:hidden}
.hh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:13.5px}
.hh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hh .ln{color:var(--mute);font-size:12.5px}
.bar{width:60px;height:6px;background:var(--line);border-radius:9px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--pri)}
.hit pre{margin:0;border:0;border-radius:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- states ---------- */
.empty{padding:36px 20px;text-align:center}
.empty .big{font-size:40px}
.empty h3{margin:8px 0 4px;font-size:18px}
.empty p{margin:0 0 18px;color:var(--tx2)}
.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin-top:18px}
@media(max-width:700px){.guide{grid-template-columns:1fr}}
.gs{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--tx2)}
.gs b{display:block;color:var(--tx);margin-bottom:2px}
.gs i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:var(--pri-tx);font-size:12px;font-weight:700;margin-bottom:6px}
.ok{padding:22px;text-align:center;color:var(--lo)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:r .8s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
.sk{height:64px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,var(--line),var(--surface2),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo">🔎</div>
  <h1>DocSolver</h1><span class="tag">파일을 올리면 문제를 찾아 해결책을 알려드립니다</span>
  <div class="sp"></div>
  <span class="pill" id="aipill"><i class="dot"></i><span>AI 꺼짐</span></span>
</div></header>

<div class="app">
<aside>
  <section class="card pad up">
    <h3 class="ttl">파일 <span id="fcount"></span></h3>
    <div id="drop" tabindex="0" role="button" aria-label="파일 추가">
      <div class="ic">📂</div><b>파일을 끌어놓거나 클릭</b>
      <small>log · txt · md · conf · yaml · json · csv · docx · pdf</small>
    </div>
    <input id="pick" type="file" multiple hidden>
    <ul class="files" id="files"></ul>
  </section>

  <section class="card pad aibox">
    <h3 class="ttl">AI 분석</h3>
    <label class="sw"><span>🤖 결과에 AI 분석 포함</span>
      <span class="switch"><input type="checkbox" id="useai"><i></i></span></label>
    <div class="keyrow" id="aikey">
      <input type="password" id="key" placeholder="Anthropic API 키" autocomplete="off">
      <button class="btn sm pri" id="savekey">적용</button>
    </div>
    <p class="hint" id="aihint">키는 서버 메모리에만 보관되며 저장되지 않습니다. 분석 시 로그 일부가 Anthropic API로 전송됩니다.</p>
  </section>
</aside>

<main>
  <section class="card searchbar">
    <div class="sbrow">
      <div class="field"><span>🔍</span>
        <input id="q" type="text" placeholder="증상·에러 메시지 검색" autocomplete="off"><kbd>/</kbd></div>
      <button class="btn pri" id="go">검색</button>
      <button class="btn" id="scan">⚡ 전체 점검</button>
    </div>
    <div class="chips"><small>예시</small>
      <button class="chip" data-q="No space left on device">디스크 부족</button>
      <button class="chip" data-q="CrashLoopBackOff">CrashLoopBackOff</button>
      <button class="chip" data-q="permission denied selinux">권한/SELinux</button>
      <button class="chip" data-q="connection refused">연결 거부</button>
      <button class="chip" data-q="메모리 부족">메모리 부족</button>
    </div>
  </section>
  <div id="out"></div>
</main>
</div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(1)+' KB':n+' B';
const icon=n=>({log:'📜',md:'📝',pdf:'📕',docx:'📘',json:'🧾',yaml:'⚙️',yml:'⚙️',conf:'⚙️',csv:'📊'})[n.split('.').pop().toLowerCase()]||'📄';
const SEV={high:'높음',medium:'중간',low:'낮음'};
let terms=[],hasFiles=false;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('복사했습니다')}catch{toast('복사 실패')}}
document.addEventListener('click',e=>{
  const c=e.target.closest('code.cp');if(c)copy(c.textContent);
  const b=e.target.closest('.copy');if(b)copy(b.parentElement.querySelector('code,.pt').textContent);
});

/* ---------- 텍스트 렌더링 ---------- */
function hl(text){
  let h=esc(text);
  const w=terms.filter(t=>/^[a-z0-9_]{2,}$/.test(t)||/^[가-힣]{2}$/.test(t));
  if(!w.length)return h;
  return h.replace(new RegExp('('+w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>');
}
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code class="cp" title="클릭하여 복사">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function mdBlock(src){
  return src.split(/```[a-z]*\n?/).map((p,i)=>{
    if(i%2)return `<pre><button class="copy">복사</button><code>${esc(p.replace(/\n$/,''))}</code></pre>`;
    const o=[];let list=null;const close=()=>{if(list){o.push(`</${list}>`);list=null}};
    for(const l of p.split('\n')){let m;
      if(m=l.match(/^#{1,4}\s+(.*)/)){close();o.push(`<h4>${inl(m[1])}</h4>`)}
      else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();o.push('<ul>');list='ul'}o.push(`<li>${inl(m[1])}</li>`)}
      else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();o.push('<ol>');list='ol'}o.push(`<li>${inl(m[1])}</li>`)}
      else{close();if(l.trim())o.push(`<div>${inl(l)}</div>`)}}
    close();return o.join('');
  }).join('');
}

/* ---------- 상태 / 파일 ---------- */
function setAi(on){
  $('#aipill').classList.toggle('on',on);$('#aipill span').textContent=on?'AI 사용 가능':'AI 꺼짐';
  $('#aikey').hidden=on;$('#useai').disabled=!on;
  if(!on)$('#useai').checked=false;else if(!$('#useai').dataset.t){$('#useai').checked=true;$('#useai').dataset.t=1}
  $('#aihint').textContent=on?'AI 분석이 켜져 있습니다. 로그 일부가 Anthropic API로 전송됩니다.':'키는 서버 메모리에만 보관되며 저장되지 않습니다. 분석 시 로그 일부가 Anthropic API로 전송됩니다.';
}
async function loadFiles(){
  const r=await(await fetch('/api/files')).json();
  hasFiles=r.files.length>0;
  $('#fcount').innerHTML=hasFiles?`<span class="meta">${r.files.length}개</span>`:'';
  $('#files').innerHTML=hasFiles?r.files.map(f=>`<li class="file"><span class="fi">${icon(f.name)}</span>
    <div class="fn"><b title="${esc(f.name)}">${esc(f.name)}</b><span>${fmt(f.size)} · ${f.lines.toLocaleString()}줄</span></div>
    <button class="x" data-n="${esc(f.name)}" aria-label="${esc(f.name)} 삭제">✕</button></li>`).join('')
    :'<li class="nofile">아직 추가된 파일이 없습니다</li>';
  setAi(r.ai);
  document.querySelectorAll('.file .x').forEach(b=>b.onclick=async()=>{
    await fetch('/api/files?name='+encodeURIComponent(b.dataset.n),{method:'DELETE'});
    await loadFiles();hasFiles?scan():empty();toast('삭제했습니다')});
  return hasFiles;
}
async function upload(list){
  const errs=[];
  for(const f of list){
    const r=await fetch('/api/upload',{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:f});
    const j=await r.json();if(!r.ok)errs.push(j.error)}
  await loadFiles();
  if(errs.length)toast(errs[0]);else{toast(`${list.length}개 파일을 추가했습니다`);scan()}
}

/* ---------- 결과 렌더링 ---------- */
function empty(){
  $('#out').innerHTML=`<div class="card empty"><div class="big">🧭</div>
  <h3>${hasFiles?'검색어를 입력하거나 전체 점검을 눌러보세요':'파일을 추가해 시작하세요'}</h3>
  <p>로그·설정·문서 파일에서 문제를 찾아 원인과 해결 단계를 알려드립니다.</p>
  ${hasFiles?'':'<button class="btn pri" id="demo">샘플 로그로 체험하기</button>'}
  <div class="guide"><div class="gs"><i>1</i><b>파일 추가</b>왼쪽에 로그·설정 파일을 끌어놓으세요.</div>
  <div class="gs"><i>2</i><b>자동 점검</b>알려진 장애 패턴을 자동으로 찾아냅니다.</div>
  <div class="gs"><i>3</i><b>해결책 확인</b>원인과 명령어를 바로 복사해 사용하세요.</div></div></div>`;
  const d=$('#demo');if(d)d.onclick=()=>upload([new File([SAMPLE],'sample.log')]);
}
function busy(ai){$('#out').innerHTML=`<div class="sk"></div><div class="sk"></div><div class="sk"></div>${ai?'<div class="empty"><div class="spin"></div><span class="meta">AI 분석 중… 수십 초 걸릴 수 있습니다</span></div>':''}`}
function summary(fs){
  const c={high:0,medium:0,low:0};fs.forEach(f=>c[f.severity]++);
  return `<div class="sum"><div class="tile"><b>${fs.length}</b><span>탐지된 문제</span></div>
  <div class="tile hi"><b>${c.high}</b><span>높음</span></div><div class="tile md"><b>${c.medium}</b><span>중간</span></div><div class="tile lo"><b>${c.low}</b><span>낮음</span></div></div>`;
}
function findingsHtml(fs,title,withSum){
  if(!fs.length)return `<h2 class="sec">${title}</h2><div class="card ok">✅ 알려진 문제 패턴이 발견되지 않았습니다.</div>`;
  return (withSum?summary(fs):'')+`<h2 class="sec">${title} <span class="n">${fs.length}</span></h2>`+fs.map((f,i)=>`
  <details class="card fd ${f.severity}" ${i<2||fs.length<=3?'open':''}>
   <summary><span class="sev ${f.severity}">${SEV[f.severity]}</span><span class="ft">${esc(f.title)}</span><span class="cnt">${f.count}건</span><span class="chev">▶</span></summary>
   <div class="fb"><div class="cause"><b>원인</b> · ${esc(f.cause)}</div>
   <ol class="steps">${f.solutions.map(s=>`<li><span>${inl(s)}</span></li>`).join('')}</ol>
   <div class="ev"><h4>발견 위치</h4>${f.examples.map(e=>`<div class="evi"><span class="loc">${esc(e.file)}${e.line?':'+e.line:''}</span><span class="tx mono">${esc(e.text)}</span></div>`).join('')}</div></div>
  </details>`).join('');
}
const aiHtml=a=>a?`<h2 class="sec">AI 분석</h2><div class="card ai-card"><div class="ph">🤖 Claude 분석 결과</div><div class="ans">${mdBlock(a)}</div></div>`:'';
function hitsHtml(hs){
  return `<h2 class="sec">검색 결과 <span class="n">${hs.length}</span></h2>`+(hs.length?hs.map(x=>`
  <div class="card hit"><div class="hh">${icon(x.file)}<b>${esc(x.file)}</b><span class="ln">${x.start}–${x.end}줄</span>
  <span class="bar" title="관련도 ${x.score}%"><i style="width:${x.score}%"></i></span></div><pre>${hl(x.text)}</pre></div>`).join('')
  :'<div class="card empty" style="padding:24px">일치하는 내용이 없습니다. 다른 키워드로 시도해 보세요.</div>');
}

async function scan(){
  if(!await loadFiles()){empty();return}
  const ai=$('#useai').checked;busy(ai);terms=[];
  const r=await(await fetch('/api/scan')).json();
  $('#out').innerHTML=findingsHtml(r.findings,'자동 탐지된 문제와 솔루션',true);
  if(ai){const a=await(await fetch('/api/ai-scan',{method:'POST'})).json();
    $('#out').insertAdjacentHTML('afterbegin',aiHtml(a.ai));}
}
async function search(){
  const q=$('#q').value.trim();if(!q)return scan();
  if(!hasFiles&&!await loadFiles()){toast('먼저 파일을 추가하세요');empty();return}
  const ai=$('#useai').checked;busy(ai);
  const r=await(await fetch('/api/search',{method:'POST',body:JSON.stringify({q,ai})})).json();
  terms=r.terms;
  $('#out').innerHTML=aiHtml(r.ai)+findingsHtml(r.findings,'관련 솔루션',false)+hitsHtml(r.hits);
}
$('#go').onclick=search;$('#scan').onclick=scan;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#q').value=c.dataset.q;search()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
loadFiles().then(empty);
</script>
