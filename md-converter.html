<title>MD 변환기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 좌측 파일 목록(드롭존 포함) + 우측 마크다운 결과 편집기. 좁은 화면에서는 세로로 쌓임 */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#dbe1e8;
  --accent:#0b6e6e; --accent-ink:#ffffff; --accent-soft:#dff1f0;
  --ok:#1b7f4b; --warn:#a06200; --err:#b42318;
  --font-ui:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#171f27; --ink:#e6ebf0; --muted:#8fa0b1; --line:#2a3541;
  --accent:#4fc3c0; --accent-ink:#06201f; --accent-soft:#16363a;
  --ok:#5fd08e; --warn:#e0a84a; --err:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#171f27; --ink:#e6ebf0; --muted:#8fa0b1; --line:#2a3541;
  --accent:#4fc3c0; --accent-ink:#06201f; --accent-soft:#16363a;
  --ok:#5fd08e; --warn:#e0a84a; --err:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 14px;margin:12px;
  border:1.5px dashed var(--line);border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over,.drop:focus-visible{background:var(--accent-soft);border-color:var(--accent);outline:none}
.drop strong{font-size:15px}
.drop span{color:var(--muted);font-size:12px}
.fmts{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.fmts i{font-style:normal;font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
ul.files{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-height:46vh;overflow:auto}
ul.files li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
ul.files li:last-child{border-bottom:0}
ul.files li[aria-selected="true"]{background:var(--accent-soft)}
ul.files li:hover{background:var(--accent-soft)}
.fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.st{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.st.ok{color:var(--ok)} .st.run{color:var(--warn)} .st.err{color:var(--err)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--err)}
.empty{padding:16px 14px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .title{flex:1;min-width:140px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.b{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.b:hover:not(:disabled){border-color:var(--accent)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.b:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{display:block;width:100%;min-height:52vh;border:0;border-radius:0 0 8px 8px;padding:14px;resize:vertical;
  font-family:var(--font-mono);font-size:12.5px;line-height:1.6;background:var(--surface);color:var(--ink)}
textarea:focus{outline:none}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.foot .note{flex:1;min-width:160px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:6px;font-size:13px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<div class="wrap">
  <header>
    <h1>MD 변환기</h1>
    <p>파일은 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-label="파일 추가">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="파일 선택 또는 끌어다 놓기">
        <strong>파일을 끌어다 놓거나 클릭</strong>
        <span>여러 파일을 한 번에 추가할 수 있습니다</span>
        <div class="fmts"><i>pdf</i><i>docx</i><i>pptx</i><i>xlsx</i><i>hwpx</i><i>csv</i><i>html</i><i>json</i><i>txt</i><i>코드</i><i>이미지</i></div>
      </div>
      <input type="file" id="pick" multiple hidden>
      <div class="opts">
        <label for="optImg"><input type="checkbox" id="optImg" checked> 이미지는 마크다운에 직접 포함 (data URI)</label>
        <label for="optPdfPg"><input type="checkbox" id="optPdfPg" checked> PDF는 페이지 구분 표시</label>
      </div>
      <ul class="files" id="list" role="listbox" aria-label="변환 목록"></ul>
      <div class="empty" id="emptyMsg">아직 추가한 파일이 없습니다.</div>
    </section>

    <section class="panel" aria-label="변환 결과">
      <div class="bar">
        <div class="title" id="curName">결과 미리보기</div>
        <button class="b" id="btnCopy" disabled>복사</button>
        <button class="b pri" id="btnSave" disabled>.md 저장</button>
      </div>
      <textarea id="out" spellcheck="false" placeholder="변환된 마크다운이 여기에 표시됩니다. 직접 수정도 가능합니다." disabled></textarea>
      <div class="foot">
        <span class="note" id="summary">0개 파일</span>
        <button class="b" id="btnMerge" disabled>하나로 합쳐 저장</button>
        <button class="b" id="btnZip" disabled>전체 ZIP 저장</button>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var items=[], sel=-1, uid=0;

var TEXT_FENCE={js:'javascript',ts:'typescript',jsx:'jsx',tsx:'tsx',py:'python',java:'java',c:'c',h:'c',cpp:'cpp',cs:'csharp',go:'go',rs:'rust',rb:'ruby',php:'php',sh:'bash',bash:'bash',ps1:'powershell',sql:'sql',css:'css',scss:'scss',xml:'xml',yaml:'yaml',yml:'yaml',toml:'toml',ini:'ini',conf:'ini',cfg:'ini',json:'json',log:'',kt:'kotlin',swift:'swift',tf:'hcl',vue:'vue',svg:'xml',env:'',properties:'ini'};
var RAW_TEXT={md:1,markdown:1,txt:1,text:1,rst:1};
var IMG={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp'};

function ext(n){var m=/\.([^.]+)$/.exec(n);return m?m[1].toLowerCase():''}
function base(n){return n.replace(/\.[^.]+$/,'')}
function esc(s){return String(s).replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>')}
function fmtSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2400)}

function decode(buf){
  var u8=new Uint8Array(buf);
  if(u8[0]===0xFF&&u8[1]===0xFE)return new TextDecoder('utf-16le').decode(u8);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u8).replace(/^﻿/,'')}
  catch(e){try{return new TextDecoder('euc-kr').decode(u8)}catch(e2){return new TextDecoder('utf-8').decode(u8)}}
}
function fence(text,lang){
  var f='```';while(text.indexOf(f)>=0)f+='`';
  return f+(lang||'')+'\n'+text.replace(/\s+$/,'')+'\n'+f+'\n';
}
function table(rows){
  rows=rows.filter(function(r){return r.some(function(c){return String(c).trim()!==''})});
  if(!rows.length)return '_(빈 시트)_\n';
  var w=Math.max.apply(null,rows.map(function(r){return r.length}));
  var norm=rows.map(function(r){var o=[];for(var i=0;i<w;i++)o.push(esc(r[i]==null?'':r[i]));return o});
  var out='| '+norm[0].join(' | ')+' |\n| '+norm[0].map(function(){return '---'}).join(' | ')+' |\n';
  for(var i=1;i<norm.length;i++)out+='| '+norm[i].join(' | ')+' |\n';
  return out;
}
function parseCSV(t,sep){
  var rows=[],r=[],c='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}
    else if(ch!=='\r')c+=ch;
  }
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
var td=null;
function turndown(){
  if(td)return td;
  td=new TurndownService({headingStyle:'atx',codeBlockStyle:'fenced',bulletListMarker:'-',emDelimiter:'*'});
  td.addRule('tbl',{filter:'table',replacement:function(c,node){
    var rows=[].map.call(node.querySelectorAll('tr'),function(tr){
      return [].map.call(tr.children,function(x){return x.textContent.trim()})});
    return '\n\n'+table(rows)+'\n';
  }});
  td.remove(['script','style']);
  return td;
}

/* ---- 변환기 ---- */
async function convert(file){
  var e=ext(file.name), buf;
  if(IMG[e]){
    if($('optImg').checked){
      var url=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(file)});
      return '!['+base(file.name)+']('+url+')\n';
    }
    return '![]('+file.name+')\n';
  }
  buf=await file.arrayBuffer();
  if(e==='pdf')return pdf(buf);
  if(e==='docx')return docx(buf);
  if(e==='pptx')return pptx(buf);
  if(e==='hwpx')return hwpx(buf);
  if(e==='xlsx'||e==='xls'||e==='xlsm'||e==='ods')return xlsx(buf);
  if(e==='doc'||e==='ppt'||e==='hwp')throw new Error('구형 바이너리 형식입니다. .docx / .pptx / .hwpx 로 저장 후 다시 시도하세요.');
  var u8=new Uint8Array(buf.slice(0,4096));
  if(u8.indexOf(0)>=0&&!(u8[0]===0xFF&&u8[1]===0xFE))throw new Error('지원하지 않는 바이너리 형식입니다.');
  var t=decode(buf);
  if(e==='html'||e==='htm'){return turndown().turndown(t)+'\n'}
  if(e==='csv')return table(parseCSV(t,','));
  if(e==='tsv')return table(parseCSV(t,'\t'));
  if(RAW_TEXT[e])return t;
  if(e==='json'){try{t=JSON.stringify(JSON.parse(t),null,2)}catch(x){}}
  return fence(t,e in TEXT_FENCE?TEXT_FENCE[e]:e);
}
async function pdf(buf){
  if(!window.pdfjsLib)throw new Error('PDF 라이브러리를 불러오지 못했습니다.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise, out=[], any=false;
  for(var p=1;p<=doc.numPages;p++){
    var tc=await (await doc.getPage(p)).getTextContent(), lines=[], y=null, cur='';
    tc.items.forEach(function(it){
      if(!it.str&&!it.hasEOL)return;
      var yy=Math.round(it.transform[5]);
      if(y!==null&&Math.abs(yy-y)>3){lines.push(cur);cur=''}
      cur+=it.str;y=yy;
    });
    lines.push(cur);
    var txt=lines.map(function(l){return l.replace(/\s+$/,'')}).join('\n').trim();
    if(txt)any=true;
    out.push(($('optPdfPg').checked?'<!-- 페이지 '+p+' -->\n':'')+txt);
  }
  if(!any)throw new Error('텍스트를 찾지 못했습니다. 스캔본(이미지) PDF는 OCR이 필요합니다.');
  return out.join('\n\n')+'\n';
}
async function docx(buf){
  if(!window.mammoth)throw new Error('DOCX 라이브러리를 불러오지 못했습니다.');
  var r=await mammoth.convertToHtml({arrayBuffer:buf},{convertImage:mammoth.images.imgElement(function(im){
    if(!$('optImg').checked)return im.read('base64').then(function(){return{src:'image'}});
    return im.read('base64').then(function(b){return{src:'data:'+im.contentType+';base64,'+b}})})});
  return turndown().turndown(r.value)+'\n';
}
async function pptx(buf){
  var z=await JSZip.loadAsync(buf), names=Object.keys(z.files).filter(function(n){return /^ppt\/slides\/slide\d+\.xml$/.test(n)});
  names.sort(function(a,b){return parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1])});
  var out=[];
  for(var i=0;i<names.length;i++){
    var xml=new DOMParser().parseFromString(await z.files[names[i]].async('string'),'text/xml');
    var paras=[].map.call(xml.getElementsByTagName('a:p'),function(p){
      return [].map.call(p.getElementsByTagName('a:t'),function(t){return t.textContent}).join('')}).filter(Boolean);
    out.push('## 슬라이드 '+(i+1)+'\n\n'+paras.map(function(p,k){return k?'- '+p:'**'+p+'**'}).join('\n'));
    var nn='ppt/notesSlides/notesSlide'+names[i].match(/(\d+)\.xml/)[1]+'.xml';
    if(z.files[nn]){var nx=new DOMParser().parseFromString(await z.files[nn].async('string'),'text/xml');
      var nt=[].map.call(nx.getElementsByTagName('a:t'),function(t){return t.textContent}).join(' ').trim();
      if(nt)out[out.length-1]+='\n\n> 노트: '+nt}
  }
  if(!out.length)throw new Error('슬라이드를 찾지 못했습니다.');
  return out.join('\n\n')+'\n';
}
async function hwpx(buf){
  var z=await JSZip.loadAsync(buf), names=Object.keys(z.files).filter(function(n){return /^Contents\/section\d+\.xml$/i.test(n)}).sort();
  var out=[];
  for(var i=0;i<names.length;i++){
    var xml=new DOMParser().parseFromString(await z.files[names[i]].async('string'),'text/xml');
    [].forEach.call(xml.getElementsByTagName('hp:p'),function(p){
      var t=[].map.call(p.getElementsByTagName('hp:t'),function(x){return x.textContent}).join('');
      if(t.trim())out.push(t.trim());
    });
  }
  if(!out.length)throw new Error('본문을 찾지 못했습니다.');
  return out.join('\n\n')+'\n';
}
async function xlsx(buf){
  if(!window.XLSX)throw new Error('엑셀 라이브러리를 불러오지 못했습니다.');
  var wb=XLSX.read(buf,{type:'array'}), out=[];
  wb.SheetNames.forEach(function(n){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
    out.push('## '+n+'\n\n'+table(rows));
  });
  return out.join('\n');
}

/* ---- 목록/화면 ---- */
function addFiles(fl){
  [].forEach.call(fl,function(f){
    var it={id:++uid,file:f,name:base(f.name)+'.md',state:'run',md:'',err:''};
    items.push(it);
    convert(f).then(function(md){it.md=md;it.state='ok'}).catch(function(e){it.state='err';it.err=(e&&e.message)||String(e)}).then(function(){render()});
  });
  if(sel<0&&items.length)sel=0;
  render();
}
function current(){return items[sel]}
function render(){
  var ul=$('list');ul.textContent='';
  items.forEach(function(it,i){
    var li=document.createElement('li');li.tabIndex=0;li.setAttribute('role','option');li.setAttribute('aria-selected',i===sel);
    var n=document.createElement('span');n.className='fn';n.textContent=it.file.name;n.title=it.file.name;
    var m=document.createElement('span');m.className='meta';m.textContent=fmtSize(it.file.size);
    var s=document.createElement('span');s.className='st '+it.state;s.textContent=it.state==='ok'?'완료':it.state==='run'?'변환 중':'실패';
    var x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label',it.file.name+' 삭제');
    x.onclick=function(ev){ev.stopPropagation();items.splice(i,1);if(sel>=items.length)sel=items.length-1;render()};
    li.append(n,m,s,x);
    li.onclick=function(){sel=i;render()};
    li.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();sel=i;render()}};
    ul.appendChild(li);
  });
  $('emptyMsg').hidden=items.length>0;
  var c=current(), out=$('out'), ok=items.filter(function(i){return i.state==='ok'});
  if(c&&document.activeElement!==out){
    out.value=c.state==='ok'?c.md:c.state==='err'?'⚠ 변환 실패\n\n'+c.err:'변환 중...';
  }
  out.disabled=!c||c.state!=='ok';
  $('curName').textContent=c?c.name:'결과 미리보기';
  $('btnCopy').disabled=$('btnSave').disabled=!c||c.state!=='ok';
  $('btnMerge').disabled=!ok.length;
  $('btnZip').disabled=!ok.length;
  var fail=items.filter(function(i){return i.state==='err'}).length;
  $('summary').textContent=items.length+'개 파일 · 완료 '+ok.length+(fail?' · 실패 '+fail:'');
}
$('out').addEventListener('input',function(){var c=current();if(c&&c.state==='ok')c.md=this.value});

/* ---- 입력 ---- */
var drop=$('drop');
drop.onclick=function(){$('pick').click()};
drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('pick').click()}};
$('pick').onchange=function(){addFiles(this.files);this.value=''};
['dragenter','dragover'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
document.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ---- 출력 ---- */
async function save(name,data){
  var dl=null;
  try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:data});toast('저장했습니다: '+name)}
    catch(e){if(e&&e.code!=='declined')toast('저장하지 못했습니다. 복사 기능을 이용하세요.')}
    return;
  }
  try{ // 로컬에서 파일로 직접 열었을 때
    var a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/markdown'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();toast('저장했습니다: '+name);
  }catch(e){toast('저장하지 못했습니다. 복사 기능을 이용하세요.')}
}
function copy(text){
  var fallback=function(){var o=$('out');o.disabled=false;o.focus();o.select();toast('텍스트를 선택했습니다. Ctrl+C로 복사하세요.')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){toast('복사했습니다')},fallback);
  else fallback();
}
function uniq(names){var seen={};return names.map(function(n){var k=n,i=1;while(seen[k]){k=n.replace(/\.md$/,'')+'_'+(++i)+'.md'}seen[k]=1;return k})}
$('btnCopy').onclick=function(){var c=current();if(c)copy(c.md)};
$('btnSave').onclick=function(){var c=current();if(c)save(c.name,c.md)};
$('btnMerge').onclick=function(){
  var ok=items.filter(function(i){return i.state==='ok'});
  save('merged.md',ok.map(function(i){return '# '+i.file.name+'\n\n'+i.md.trim()}).join('\n\n---\n\n')+'\n');
};
$('btnZip').onclick=async function(){
  if(!window.JSZip)return toast('ZIP 라이브러리를 불러오지 못했습니다.');
  var ok=items.filter(function(i){return i.state==='ok'}), z=new JSZip(), names=uniq(ok.map(function(i){return i.name}));
  ok.forEach(function(it,i){z.file(names[i],it.md)});
  save('markdown-files.zip',await z.generateAsync({type:'blob'}));
};
render();
})();
</script>
